<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07080f">
  <title>Send — Stream</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="/"><span class="logo">📨</span><span class="name">Send</span></a>
      <div class="nav-links">
        <span class="nav-bell" id="btnBell">🔔<span class="bell-label"></span></span>
        <a href="/">← Home</a>
        <a href="/stream" class="active">Stream</a>
      </div>
    </div>
  </nav>

  <!-- gate -->
  <div class="card gate" id="gate">
    <h2>📡 Stream</h2>
    <div class="sub">Share your screen live, or watch someone else's stream.</div>

    <div class="gate-actions">
      <button class="gate-action" id="btnGoLive">
        <span class="ga-ic">🎬</span>
        <span><span class="ga-t">Go live</span><br><span class="ga-s">share your screen</span></span>
      </button>
      <button class="gate-action" id="btnWatch">
        <span class="ga-ic">👀</span>
        <span><span class="ga-t">Watch</span><br><span class="ga-s">join a stream</span></span>
      </button>
    </div>

    <!-- live streams list -->
    <div class="or-divider">live now</div>
    <div id="liveList"></div>
  </div>

  <!-- host setup modal -->
  <div class="lightbox" id="hostModal">
    <div class="card" style="max-width:420px;width:calc(100% - 32px);padding:26px">
      <h3 style="font-size:1.1rem;font-weight:800;margin-bottom:14px">🎬 Go live</h3>
      <div class="field">
        <label class="fl">Stream code (your link)</label>
        <div class="row">
          <input type="text" id="hostCode" placeholder="auto" maxlength="40" readonly>
          <button class="btn small" id="btnRegen">↻</button>
        </div>
      </div>
      <div class="field">
        <label class="fl">Password (optional)</label>
        <input type="password" id="hostPw" placeholder="Leave empty = anyone can watch" autocomplete="new-password">
      </div>
      <div class="small" id="hostErr" style="color:var(--danger);min-height:16px;font-weight:600"></div>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn" id="hostCancel" style="flex:1">Cancel</button>
        <button class="btn primary" id="hostGo" style="flex:1">Start streaming</button>
      </div>
    </div>
  </div>

  <!-- watch modal -->
  <div class="lightbox" id="watchModal">
    <div class="card" style="max-width:400px;width:calc(100% - 32px);padding:26px">
      <h3 style="font-size:1.1rem;font-weight:800;margin-bottom:14px">👀 Watch stream</h3>
      <div class="field">
        <label class="fl">Stream code</label>
        <input type="text" id="watchCode" placeholder="e.g. abc123" maxlength="40" dir="auto">
      </div>
      <div class="field hidden" id="watchPwField">
        <label class="fl">Stream password</label>
        <input type="password" id="watchPw" autocomplete="off">
      </div>
      <div class="small" id="watchErr" style="color:var(--danger);min-height:16px;font-weight:600"></div>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn" id="watchCancel" style="flex:1">Cancel</button>
        <button class="btn primary" id="watchGo" style="flex:1">Watch</button>
      </div>
    </div>
  </div>

  <!-- stream view (host) -->
  <div class="wrap hidden" id="hostView">
    <div class="items-toolbar">
      <span style="font-size:1.3rem">🎬</span>
      <h2 style="font-size:1.3rem;margin:0">You're live</h2>
      <span class="pill ok" id="liveDot">● LIVE</span>
      <span class="count" id="viewerCount">0 viewers</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn small danger" id="btnStopStream">⏹ Stop stream</button>
    </div>
    <div class="card" style="padding:14px">
      <video id="hostPreview" autoplay muted playsinline style="width:100%;border-radius:12px;background:#000"></video>
    </div>
    <div class="small muted" style="margin-top:10px">Share this link: <span class="mono" id="shareLink" style="color:#93a4ff;user-select:all"></span></div>
  </div>

  <!-- stream view (viewer) -->
  <div class="wrap hidden" id="watchView">
    <div class="items-toolbar">
      <span style="font-size:1.3rem">👀</span>
      <h2 style="font-size:1.3rem;margin:0" id="watchTitle">stream</h2>
      <span class="pill ok">● LIVE</span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn small" id="btnLeaveStream">Leave</button>
    </div>
    <div class="card" style="padding:14px">
      <video id="viewerVideo" autoplay playsinline style="width:100%;border-radius:12px;background:#000"></video>
    </div>
  </div>

  <footer class="footer" style="margin-top:40px">
    <div class="logo-sm">Send · <span class="crown">With the code of Qai9rr</span></div>
  </footer>

  <div class="toasts" id="toasts"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/static/notify.js?v=10"></script>
  <script src="/static/profile.js?v=10"></script>
  <script src="/static/stream.js?v=10"></script>
</body>
</html>
