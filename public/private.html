<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07080f">
  <title>Send — Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="brand" href="/"><span class="logo">📨</span><span class="name">Send</span></a>
      <div class="nav-links">
        <a href="/">← Home</a>
        <a href="/private" class="active">Chat</a>
      </div>
    </div>
  </nav>

  <!-- gate -->
  <div class="card gate" id="gate">
    <h2>💬 Chat</h2>
    <div class="sub">Join the public chat, or create a private room and share its code.</div>

    <div class="field">
      <label class="fl">Your name</label>
      <input type="text" id="gateName" placeholder="e.g. Alex" maxlength="30">
    </div>

    <button class="btn primary" id="btnPublic" style="width:100%;font-size:1rem">🌍 Join the public chat</button>

    <div class="or-divider">or create / join a private room</div>
    <button class="btn" id="btnCreate" style="width:100%">✨ Create a new private room</button>
    <div class="row mt">
      <input type="text" id="gateRoom" placeholder="room code" maxlength="40" style="text-transform:lowercase" autocomplete="off">
      <button class="btn" id="btnJoin">Join</button>
    </div>
    <div id="myRooms" style="margin-top:20px"></div>
  </div>

  <!-- chat -->
  <div class="wrap hidden" id="chatWrap">
    <div class="chat-app">
      <div class="card panel">
        <div class="ph">Rooms</div>
        <button class="room-item" id="roomPublic" data-goto="public">
          <span>🌍 Public chat</span><span class="code">everyone</span>
        </button>
        <div class="room-list" id="roomList" style="margin-top:8px"></div>
        <button class="btn small ghost mt" id="btnNewRoom" style="width:100%;margin-top:12px">＋ New private room</button>
      </div>
      <div class="card chat-main">
        <div class="chat-header">
          <span style="font-size:1.25rem" id="roomIcon">💬</span>
          <span class="hash">#</span><span class="room-title" id="roomTitle">—</span>
          <span id="adminBadge" class="badge text hidden">private admin</span>
          <span class="right">
            <button class="btn small danger" id="btnDeleteRoom" title="Delete this room">🗑 Delete room</button>
            <button class="btn small" id="btnShare" title="Share room link">🔗 Share</button>
            <button class="btn small ghost" id="btnLeave">Leave</button>
          </span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="typing-ind" id="typingInd"></div>
        <div class="chat-input">
          <button class="btn icon" id="btnImage" title="Send an image">🖼️</button>
          <input type="text" id="msgInput" placeholder="Type a message…" autocomplete="off" maxlength="4000">
          <button class="btn primary" id="btnSend">Send</button>
          <input type="file" id="imageInput" accept="image/*" hidden>
        </div>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/static/private.js?v=3"></script>
</body>
</html>
