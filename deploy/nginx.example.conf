# Example nginx reverse proxy (for a VPS with your own domain)
# Put this in /etc/nginx/sites-available/send.conf  (adjust server_name + cert paths)

server {
    listen 80;
    server_name send.yourdomain.com;

    # redirect http -> https (use certbot to get a certificate)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name send.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/send.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/send.yourdomain.com/privkey.pem;

    # upload size limit — match the app's 20 GB max
    client_max_body_size 20G;

    # static + app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # websocket (private chat) — long timeouts
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
